name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.5.1

      - name: Install test dependency
        run: arduino-cli lib install ArduinoJson@7.4.3

      - name: Run host unit tests
        run: tools/run_unit_tests.sh

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.5.1

      - name: Install dependencies
        run: tools/setup_arduino_dependencies.sh

      - name: Install icon rendering tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      - name: Compile firmware
        run: tools/build_firmware.sh --output-dir .build/firmware

      - name: Validate release packaging
        run: |
          tools/package_release.sh v0.0.0 .build/firmware .build/release-test
          cd .build/release-test
          shasum -a 256 -c SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sky-overhead-${{ github.sha }}
          path: .build/firmware/
          if-no-files-found: error
          retention-days: 14
