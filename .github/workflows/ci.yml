name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run unit tests in Docker
        run: docker buildx bake tests

  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build firmware and validate release packaging in Docker
        run: docker buildx bake

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sky-overhead-${{ github.sha }}
          path: .build/firmware/
          if-no-files-found: error
          retention-days: 14
