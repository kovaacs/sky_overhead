name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1

      - name: Install test dependency
        run: arduino-cli lib install ArduinoJson@7.4.3

      - name: Run host unit tests
        run: tools/run_unit_tests.sh

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1

      - name: Install dependencies
        run: tools/setup_arduino_dependencies.sh

      - name: Compile firmware
        run: arduino-cli compile --output-dir .build/firmware .

      - name: Validate release packaging
        run: |
          tools/package_release.sh v0.0.0 .build/firmware .build/release-test
          cd .build/release-test
          shasum -a 256 -c SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sky-overhead-${{ github.sha }}
          path: .build/firmware/
          if-no-files-found: error
          retention-days: 14
