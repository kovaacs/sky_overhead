name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use stable SemVer, for example v0.1.0" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Test, build, and package release in Docker
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: docker buildx bake release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".build/release/sky-overhead-$GITHUB_REF_NAME-merged.bin#Merged ESP32-S3 flash image" \
            ".build/release/sky-overhead-$GITHUB_REF_NAME-firmware.zip#Component firmware package" \
            ".build/release/SHA256SUMS#SHA-256 checksums" \
            --verify-tag \
            --title "Sky Overhead $GITHUB_REF_NAME" \
            --notes "Download the merged binary for the simplest installation. See the [flashing guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/FLASHING.md) for checksum verification, flashing, recovery, and SD-card configuration steps." \
            --generate-notes
