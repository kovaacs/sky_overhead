profiles:
  reterminal_e1001:
    notes: Pinned build for the Seeed reTerminal E1001 / XIAO ESP32S3
    fqbn: esp32:esp32:XIAO_ESP32S3:PSRAM=opi,UploadSpeed=460800,FlashSize=8M,PartitionScheme=default_8MB
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Sensirion I2C SHT4x (1.1.2)
      - dependency: Sensirion Core (0.7.3)
      - dir: .arduino-sketchbook/libraries/Seeed_GFX

default_profile: reterminal_e1001
